services:
  sagsins-server:
    build: ./server
    container_name: sagsins-server
    cap_add:
      - NET_ADMIN
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      - ./topology_data.csv:/app/topology_data.csv
    environment:
      # 🔮 Prediction Service Config (running on host)
      - PREDICTION_SERVICE_URL=http://host.docker.internal:5000
      - PREDICTION_ENABLED=true
      - HOST_TRAFFIC_CSV=E:\adocument\PBL4\Code\SAGSINs-Simulator\docker\data\traffic_data.csv
      - TZ=Asia/Ho_Chi_Minh
    extra_hosts:
      # Allow container to access host machine
      - "host.docker.internal:host-gateway"
    networks:
      sagsin_net:
        ipv4_address: 10.10.0.100

  # sample agent nodes
  sattelite_01:
    build: ./node
    container_name: SATELLITE_01
    cap_add:
      - NET_ADMIN
    environment:
      - NODE_ID=SATELLITE_01
      - SERVER_IP=10.10.0.100
      - AUTO_TRAFFIC=false
    volumes:
      - ./topology_data.csv:/app/topology_data.csv
    networks:
      sagsin_net:
        ipv4_address: 10.10.0.11
  sattelite_02:
